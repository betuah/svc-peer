# Compose hub (NAT bridge). Secrets here are for local smoke only.
listen_addr: ":8080"
hub_id: "hub-main"
center_bootstrap: "change-me-center-bootstrap"
management_token_seed: "change-me-management-token"
relay_secret: "change-me-relay-secret"
overlay_cidr: "10.10.0.0/16"
dns_suffix: "peer.local"
stun_urls:
  - "stun:stun.l.google.com:19302"
relay_urls:
  - "udp://relay:3478"
  - "ws://relay:3479/relay"
heartbeat_timeout_sec: 45
state_path: "/var/lib/svc-peer/hub-state.json"

# Production: mount PEM cert/key and set both paths (serves HTTPS + WSS).
# Example Compose volume: ./certs:/etc/svc-peer/tls:ro
# tls_cert_file: "/etc/svc-peer/tls/cert.pem"
# tls_key_file: "/etc/svc-peer/tls/key.pem"
