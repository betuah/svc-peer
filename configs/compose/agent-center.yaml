# When hub TLS is enabled, use https://hub:8080 (WSS for control).
hub_url: "http://hub:8080"
# hub_tls_insecure_skip_verify: false
hub_id: "hub-main"
role: "center"
center_bootstrap: "change-me-center-bootstrap"
name: "center-app"
state_dir: "/var/lib/svc-peer/center"
tags: ["center"]
capabilities: ["app"]
wg_backend: "userspace"
wg_interface: "sp0"
wg_listen_port: 51820
heartbeat_sec: 15
direct_wait_sec: 8
local_api_listen: "0.0.0.0:9100"
edge_tokens:
  - id: "seed-cam-01"
    token: "spt_dev_cam_warehouse_01_replace_me"
    label: "cam-warehouse-01"
    tags: ["warehouse", "camera"]
