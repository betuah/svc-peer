# svc-peer hub example configuration
listen_addr: ":8080"
hub_id: "hub-main"
# Bootstrap / first management token (mint/revoke agent tokens, grant/revoke A2A).
# Not a parallel hub_secret auth system — place this secret in ops config only.
management_token_seed: "change-me-management-token"
# HMAC key shared with the relay process (ticket verification). Separate from auth tokens.
relay_secret: "change-me-relay-secret"
overlay_cidr: "10.10.0.0/16"
dns_suffix: "peer.local"
hub_endpoint: "127.0.0.1:51820"
stun_urls:
  - "stun:stun.l.google.com:19302"
relay_urls:
  - "udp://127.0.0.1:3478"
  - "ws://127.0.0.1:3479/relay"
heartbeat_timeout_sec: 45

# Pre-seeded agent tokens (scoped to hub_id). Agent ID is created on first register.
pre_seed_tokens:
  - id: "seed-cam-01"
    token: "spt_dev_cam_warehouse_01_replace_me"
    label: "cam-warehouse-01"
    tags: ["warehouse", "camera"]
  - id: "seed-viewer-01"
    token: "spt_dev_viewer_01_replace_me"
    label: "viewer-01"
    tags: ["viewer"]
