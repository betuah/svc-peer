# svc-peer thin hub (NAT bridge / signaling) — Model 1 or self-host colocation
listen_addr: ":8080"
hub_id: "hub-main"

# Shared with center agent config. Center first-register only (claims sole center).
# Not used by edges; not day-to-day edge mint.
center_bootstrap: "change-me-center-bootstrap"

# Optional ops / break-glass management token seed (not primary edge onboarding).
management_token_seed: "change-me-management-token"

# HMAC key shared with the relay process (ticket verification). Not an auth token.
relay_secret: "change-me-relay-secret"

overlay_cidr: "10.10.0.0/16"
dns_suffix: "peer.local"
stun_urls:
  - "stun:stun.l.google.com:19302"
relay_urls:
  - "udp://127.0.0.1:3478"
  - "ws://127.0.0.1:3479/relay"
heartbeat_timeout_sec: 45

# Durable hub membership + edge allowlist cache (JSON file).
# Online presence is not persisted. Center remains token source of truth and
# re-syncs via PUT /hub/allowlist on connect. Empty disables persistence.
state_path: "./data/hub-state.json"

# TLS for hub REST + control WebSocket (HTTPS / WSS). Leave both empty for
# plain HTTP (local/dev). Production and cloud/self-host deployments should set
# both paths to a PEM certificate and private key.
# tls_cert_file: "/etc/svc-peer/tls/cert.pem"
# tls_key_file: "/etc/svc-peer/tls/key.pem"

# Logging: level info|debug; format text (default, readable) or json (collectors).
log_level: info
log_format: text
# Prometheus metrics: GET /metrics on listen_addr (same as /health).
