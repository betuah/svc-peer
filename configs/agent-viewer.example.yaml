# svc-peer edge agent (viewer) — peers only the center (direct WG)
# Use https:// when the hub has TLS enabled (control channel becomes WSS).
hub_url: "http://127.0.0.1:8080"
# hub_tls_insecure_skip_verify: false  # default; set true only for self-signed local/dev
hub_id: "hub-main"
role: "edge"
token: "spt_dev_viewer_01_replace_me"
name: "viewer-01"
state_dir: "./state/viewer-01"
tags: ["viewer"]
capabilities: ["video/player"]
wg_backend: "auto"
wg_interface: "sp1"
wg_listen_port: 51821
heartbeat_sec: 15
direct_wait_sec: 8
local_api_listen: "127.0.0.1:9101"
log_level: info
log_format: text
