# svc-peer center agent (business authority + main app) — exactly one per hub_id
hub_url: "http://127.0.0.1:8080"
hub_id: "hub-main"
role: "center"
# Must match hub center_bootstrap
center_bootstrap: "change-me-center-bootstrap"
name: "center-app"
state_dir: "./state/center"
tags: ["center"]
capabilities: ["app"]
wg_backend: "auto"
wg_interface: "sp0"
wg_listen_port: 51820
heartbeat_sec: 15
direct_wait_sec: 8

# Edge join tokens created/configured on center; synced to hub allowlist on start.
edge_tokens:
  - id: "seed-cam-01"
    token: "spt_dev_cam_warehouse_01_replace_me"
    label: "cam-warehouse-01"
    tags: ["warehouse", "camera"]
  - id: "seed-viewer-01"
    token: "spt_dev_viewer_01_replace_me"
    label: "viewer-01"
    tags: ["viewer"]
