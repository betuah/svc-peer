# svc-peer center agent (role=center; network authority) — exactly one per hub_id
# Use https:// when the hub has TLS enabled (control channel becomes WSS).
hub_url: "http://127.0.0.1:8080"
# hub_tls_insecure_skip_verify: false  # default; set true only for self-signed local/dev
hub_id: "hub-main"
role: "center"
# Must match hub center_bootstrap
center_bootstrap: "change-me-center-bootstrap"
name: "center-app"
state_dir: "./state/center"
tags: ["center"]
capabilities: ["app"]
wg_backend: "auto"
wg_interface: "sp0"
wg_listen_port: 51820
heartbeat_sec: 15
direct_wait_sec: 8
# Agent-local HTTP API (loopback). Empty disables.
local_api_listen: "127.0.0.1:9100"

# Optional seed for edge join tokens. Merged into {state_dir}/allowlist.json on start
# (missing ids inserted; active ids updated; revoked ids are not resurrected).
# Day-to-day mint/revoke: center local API /local/allowlist (synced to hub).
edge_tokens:
  - id: "seed-cam-01"
    token: "spt_dev_cam_warehouse_01_replace_me"
    label: "cam-warehouse-01"
    tags: ["warehouse", "camera"]
  - id: "seed-viewer-01"
    token: "spt_dev_viewer_01_replace_me"
    label: "viewer-01"
    tags: ["viewer"]
